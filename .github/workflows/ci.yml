# SPDX-License-Identifier: Apache-2.0
name: Public release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-checks:
    name: Public snapshot and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify public inventory and document bundle
        run: |
          node scripts/publication.mjs check
          node scripts/build-site-docs.mjs --check
          node --test tests/publication.test.mjs tests/site-docs.test.mjs tests/website-package.test.mjs
      - name: Test community runtime
        run: |
          cargo test --workspace --offline
          cargo build --workspace --offline
          node scripts/smoke.mjs
